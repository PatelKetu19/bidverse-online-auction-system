<!DOCTYPE html>
<html ng-app="auctionApp">
<head>
    <title>Dashboard</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
        }
    </style>
</head>

<body ng-controller="dashCtrl">

<h2>Dashboard</h2>

<p>Welcome {{user.username}}</p>

<div ng-if="user.role == 'seller'">
    <button onclick="window.location='seller.html'">Go to Seller Page</button>
</div>

<div ng-if="user.role == 'buyer'">
    <button onclick="window.location='buyer.html'">Go to Buyer Page</button>
</div>

<div ng-if="user.role == 'admin'">
    <button onclick="window.location='admin.html'">Go to Admin Page</button>
</div>

<script>
var app = angular.module("auctionApp", []);

app.controller("dashCtrl", function($scope) {

    // Get user from localStorage
    $scope.user = JSON.parse(localStorage.getItem("user"));

});
</script>

</body>
</html>
